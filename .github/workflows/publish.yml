name: Publish Package to NPM
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-latest
    # Protected environment: only release tags (X.Y.Z) may deploy to it, and
    # Paul or Moe must approve each run (admins can bypass). The job that can
    # mint the npm OIDC token never starts without that approval.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Publish only reviewed code: the release must point at a commit that
      # is already on main, so a release cut from a side branch can't reach
      # npm or the MCP registry.
      - name: Check release is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not on main."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # The registry entry names the npm version, so all three must match the
      # release before anything is published.
      - name: Check versions match the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg=$(jq -r .version package.json)
          server=$(jq -r .version server.json)
          server_pkg=$(jq -r '.packages[] | select(.registryType == "npm") | .version' server.json)
          echo "release ${TAG#v}, package.json $pkg, server.json $server / $server_pkg"
          if [ "${TAG#v}" != "$pkg" ] || [ "$pkg" != "$server" ] || [ "$pkg" != "$server_pkg" ]; then
            echo "::error::Release, package.json and server.json versions differ"
            exit 1
          fi
      # Latest npm for OIDC trusted publishing. Installed only now: npm 12
      # blocks dependency install scripts, so installing and testing with it
      # can fail where a normal install passes.
      - name: Install latest npm
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --access public
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
      # ai.withone/* is proven by the ed25519 key published in withone.ai's DNS.
      - name: Publish to the MCP registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set, so the MCP registry was not updated"
            exit 1
          fi
          ./mcp-publisher login dns --domain withone.ai --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          # The registry checks the npm package, which can take a moment to appear.
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Clear registry login
        if: always()
        run: rm -rf ~/.config/mcp-publisher ./mcp-publisher
